name: Release

on:
  release:
    types: [created]

jobs:
  get-release:
    runs-on: ubuntu-latest
    steps:
    - name: Get Release
      id: get_release
      uses: bruceadams/get-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Dump upload url to file
      run: echo '${{ steps.get_release.outputs.upload_url }}' > upload_url
    - name: Upload upload_url
      uses: actions/upload-artifact@v4
      with:
        name: upload_url
        path: upload_url

  build:
    needs: get-release
    strategy:
      matrix:
        platform: [
          'linux-arm',
          'linux-arm64',
#          'linux-x64',
        ]
        pair: [
#          'python:3.7',
#          'python:3.9',
          'python:3.11',
        ]
        include:
          - platform: 'linux-arm'
            host-os: 'ubuntu-latest'
            archy: 'armv7'
          - platform: 'linux-arm64'
            host-os: 'ubuntu-latest'
            archy: 'aarch64'
#          - platform: 'linux-x64'
#            host-os: 'ubuntu-latest'
#          - pair: 'python:3.7'
#            language: 'python'
#            version: '3.7'
#          - pair: 'python:3.9'
#            language: 'python'
#            version: '3.9'
          - pair: 'python:3.11'
            language: 'python'
            version: '3.11'
    runs-on: ${{ matrix.host-os }}

    steps:
    - name: Download upload_url
      uses: actions/download-artifact@v4
      with:
        name: upload_url
        path: upload_url
    - name: Set upload_url
      run: echo "UPLOAD_URL=$(cat upload_url/upload_url)" >> $GITHUB_ENV
    - name: Set release version
      run: echo "RELEASE_VERSION=${GITHUB_REF:10}" >> $GITHUB_ENV
    - uses: actions/checkout@v3
    - name: Use Python ${{ matrix.version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.version }}
    - name: Make build script executable
      run: chmod +x ./build.sh
    - name: Make packaging script executable
      run: chmod +x ./package.sh
    #- name: Build adapter
    #  run: |
    #    ./build.sh "${{ matrix.platform }}" "${{ matrix.language }}" "${{ matrix.version }}"
    #  shell: bash

    - uses: uraimo/run-on-arch-action@v2
      name: Build it
      id: runcmd
      with:
        arch: ${{ matrix.archy }}
        distro: ubuntu22.04
        setup: |
          echo "."
          echo ".."
          echo "run-on-arch setup"
          mkdir -p "${PWD}/build"
          
        # Mount the build directory as /build in the container
        dockerRunArgs: |
          --volume "${PWD}/build:/build"
          #--volume "${PWD}/package:/package"

        # Pass some environment variables to the container
        #env: | # YAML, but pipe character is necessary
          #artifact_name: git-${{ matrix.distro }}_${{ matrix.arch }}
        
        # Not required, but speeds up builds by storing container images in
        # a GitHub package registry. Make sure there are no secrets in the disk image!
        githubToken: ${{ github.token }}

        shell: /bin/bash

        install: |
          echo "."
          echo "INSTALL"
          
        run: |
          cd build
          chmod +x package.sh
          ADDON_ARCH="${{ matrix.platform }}" ./package.sh
     
    - name: List after container
      run: |
        ls -lh
      shell: bash
      
    - name: Upload Release Asset tgz
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        #upload_url: ${{ github.event.release.upload_url }}
        upload_url: ${{ env.UPLOAD_URL }}
        asset_path: voco-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-v${{ matrix.version }}.tgz
        overwrite: true
      
    - name: Upload Release Asset shasum
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        #upload_url: ${{ github.event.release.upload_url }}
        upload_url: ${{ env.UPLOAD_URL }}
        asset_path: voco-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-v${{ matrix.version }}.tgz.sha256sum
        overwrite: true
      

