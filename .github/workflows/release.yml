name: Release
#ubuntu-22.04-arm

on:
  release:
    types: [created]

jobs:
  build_job:
    # The host should always be linux
    runs-on: ubuntu-24.04
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }}

    # Run steps on a matrix of 4 arch/distro combinations
    strategy:
      matrix:
        arch: [aarch64,armv7]
        version: ['3.11']
        include:
        - distro: bookworm
        - arch: aarch64
          platform: linux-arm64
        - arch: armv7
          platform: linux-arm

    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v3
        name: Build artifact
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          version: ${{ matrix.version }}

          # Not required, but speeds up builds
          # githubToken: ${{ github.token }}

          # Create a build directory
          setup: |
            mkdir -p "${PWD}/build"

          # Mount the build directory as /build in the container
          dockerRunArgs: |
            --volume "${PWD}/build:/build"

          # Pass some environment variables to the container
          env: | # YAML, but pipe character is necessary
            artifact_name: git-${{ matrix.distro }}_${{ matrix.arch }}

          # The shell to run commands with in the container
          shell: /bin/bash

          # Install some dependencies in the container. This speeds up builds if
          # you are also using githubToken. Any dependencies installed here will
          # be part of the container image that gets cached, so subsequent
          # builds don't have to re-install them. The image layer is cached
          # publicly in your project's package repository, so it is vital that
          # no secrets are present in the container state or logs.
          install: |
            case "${{ matrix.distro }}" in
              ubuntu*|jessie|stretch|buster|bullseye|bookworm)
                apt-get update -q -y
                apt-get install -q -y git 
                apt-get install -q -y "python${{ matrix.version }}"
                alias python="python${{ matrix.version }}"
                alias python3="python${{ matrix.version }}"
                ls -al "${PWD}"
                python3 --version
                ;;
              fedora*)
                dnf -y update
                dnf -y install git which
                ls -al "${PWD}"
                python3 --version
                ;;
              alpine*)
                apk update
                apk add git
                ls -al "${PWD}"
                python3 --version
                ;;
            esac

          # Produce a binary artifact and place it in the mounted volume
          #run: |
          #  cp $(which git) "/build/${artifact_name}"
          #  echo "Produced artifact at /build/${artifact_name}"

          run: |
              cd build
              chmod +x package.sh
              ADDON_ARCH="${{ matrix.platform }}" ./package.sh


      - name: Show the artifact
        # Items placed in /build in the container will be in
        # ${PWD}/build on the host.
        run: |
          ls -al "${PWD}/build"


      - name: List after container
        run: |
            ls -lh
            shell: bash
      
      - name: Upload Release Asset tgz
        uses: shogo82148/actions-upload-release-asset@v1
        with:
              #upload_url: ${{ github.event.release.upload_url }}
              upload_url: ${{ env.UPLOAD_URL }}
              asset_path: voco-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-v${{ matrix.version }}.tgz
              overwrite: true
      
      - name: Upload Release Asset shasum
        uses: shogo82148/actions-upload-release-asset@v1
        with:
            #upload_url: ${{ github.event.release.upload_url }}
            upload_url: ${{ env.UPLOAD_URL }}
            asset_path: voco-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-v${{ matrix.version }}.tgz.sha256sum 
            overwrite: true
